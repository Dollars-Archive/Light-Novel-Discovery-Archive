name: Publish light novel archive
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/assets/app.js && node --check docs/assets/review-core.js && node --check docs/assets/review-sync.js
      - run: node -e "const d=JSON.parse(require('fs').readFileSync('docs/data/games.json')); if(d.version!==1 || !Array.isArray(d.novels)) process.exit(1)"
      - run: node --test tests/sync.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
